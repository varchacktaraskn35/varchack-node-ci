name: CI

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
          if-no-files-found: error

      - name: Set image tag from commit
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/nodeapp:${{ env.IMAGE_TAG }}

      - name: Decode SSH key
        env:
          SSH_KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
        run: |
          printf '%s' "$SSH_KEY_B64" | tr -d '[:space:]' | base64 -d > ec2-key.pem
          chmod 600 ec2-key.pem

      - name: Deploy container to EC2
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/nodeapp:${{ env.IMAGE_TAG }}
        run: |
          ssh -i ec2-key.pem -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
            command -v docker >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq docker.io)
            sudo systemctl start docker
            sudo docker rm -f nodeapp || true
            sudo docker pull $IMAGE
            sudo docker run -d --name nodeapp -p 3000:3000 $IMAGE
          EOF
